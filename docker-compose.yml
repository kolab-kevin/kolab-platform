name: kolab-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kolab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kolab}
      POSTGRES_DB: ${POSTGRES_DB:-kolab}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kolab}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolab}:${POSTGRES_PASSWORD:-kolab}@postgres:5432/${POSTGRES_DB:-kolab}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolab}:${POSTGRES_PASSWORD:-kolab}@postgres:5432/${POSTGRES_DB:-kolab}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  public-api:
    build:
      context: .
      dockerfile: docker/public-api.Dockerfile
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolab}:${POSTGRES_PASSWORD:-kolab}@postgres:5432/${POSTGRES_DB:-kolab}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mobile-api:
    build:
      context: .
      dockerfile: docker/mobile-api.Dockerfile
    restart: unless-stopped
    ports:
      - '4002:4002'
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolab}:${POSTGRES_PASSWORD:-kolab}@postgres:5432/${POSTGRES_DB:-kolab}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ai-services:
    build:
      context: .
      dockerfile: docker/ai-services.Dockerfile
    restart: unless-stopped
    ports:
      - '4003:4003'
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-kolab}:${POSTGRES_PASSWORD:-kolab}@postgres:5432/${POSTGRES_DB:-kolab}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

  creator-portal:
    build:
      context: .
      dockerfile: docker/creator-portal.Dockerfile
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

  moderator:
    build:
      context: .
      dockerfile: docker/moderator.Dockerfile
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
