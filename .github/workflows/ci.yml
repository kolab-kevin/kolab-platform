name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kolab:kolab@localhost:5432/kolab?schema=public
  JWT_SECRET: ci-secret-key-minimum-32-characters-long-for-tests
  REDIS_URL: redis://localhost:6379
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  backend-quality-gate:
    name: Backend quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @kolab/database exec prisma validate --schema prisma/schema.prisma

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build @kolab/types
        run: pnpm --filter @kolab/types build

      - name: Build @kolab/config
        run: pnpm --filter @kolab/config build

      - name: Test @kolab/auth
        run: pnpm --filter @kolab/auth test

      - name: Test @kolab/storage
        run: pnpm --filter @kolab/storage test

      - name: Typecheck @kolab/api
        run: pnpm --filter @kolab/api typecheck

      - name: Test @kolab/api
        run: pnpm --filter @kolab/api test

      - name: Lint @kolab/api
        run: pnpm --filter @kolab/api lint

      - name: Markdownlint docs
        run: pnpm exec markdownlint-cli2 "docs/**/*.md"

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:ci
      - run: pnpm check:licenses
      - run: pnpm check:cycles

  ci-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [dependency-review, backend-quality-gate, audit]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [[ "${{ needs.dependency-review.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-quality-gate.result }}" == "failure" ]] || \
             [[ "${{ needs.audit.result }}" == "failure" ]]; then
            echo "One or more quality gates failed."
            exit 1
          fi
          echo "All quality gates passed."
