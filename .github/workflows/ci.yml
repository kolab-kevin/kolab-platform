name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://kolab:kolab@localhost:5432/kolab?schema=public
  JWT_SECRET: ci-secret-key-minimum-32-characters-long-for-tests
  REDIS_URL: redis://localhost:6379
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm db:generate
      - name: Lint @kolab/api
        run: pnpm --filter @kolab/api lint
      - name: Markdownlint docs
        run: pnpm lint:md:docs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma validate
        run: pnpm --filter @kolab/database exec prisma validate --schema prisma/schema.prisma
      - name: Prisma generate
        run: pnpm db:generate
      - name: Test @kolab/auth
        run: pnpm --filter @kolab/auth test
      - name: Test @kolab/storage
        run: pnpm --filter @kolab/storage test
      - name: Test @kolab/api
        run: pnpm --filter @kolab/api test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm db:generate
      - name: Build @kolab/types
        run: pnpm --filter @kolab/types build
      - name: Build @kolab/config
        run: pnpm --filter @kolab/config build
      - name: Typecheck @kolab/api
        run: pnpm --filter @kolab/api typecheck

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:ci
      - run: pnpm check:licenses
      - run: pnpm check:cycles

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nest-service.Dockerfile
          push: false
          tags: kolab/api:ci
          build-args: |
            APP_FILTER=@kolab/api
            APP_DIR=api
            APP_PORT=4000
            IMAGE_TITLE=KOLAB API
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/next-service.Dockerfile
          push: false
          tags: kolab/web:ci
          build-args: |
            APP_FILTER=@kolab/web
            APP_DIR=web
            APP_PORT=3000
            IMAGE_TITLE=KOLAB Web
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [dependency-review, lint, test, build, audit, docker]
    if: always()
    steps:
      - name: Verify all required jobs passed
        run: |
          if [[ "${{ needs.dependency-review.result }}" == "failure" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.audit.result }}" == "failure" ]] || \
             [[ "${{ needs.docker.result }}" == "failure" ]]; then
            echo "One or more quality gates failed."
            exit 1
          fi
          echo "All quality gates passed."
